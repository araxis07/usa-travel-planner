<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#162e3c" />
    <meta
      name="description"
      content="Discover all 50 U.S. states, explore an interactive atlas, save your favorite places, and build your own American road trip. Available in English, Thai, Chinese, Japanese and Korean."
    />
    <meta property="og:title" content="Roam America — America, your way" />
    <meta
      property="og:description"
      content="50 states. Endless possibilities. Find your next American adventure and make it a plan."
    />
    <meta property="og:type" content="website" />
    <link
      data-roam-cover
      media="(min-width: 761px)"
      rel="preload"
      as="image"
      href="/images/responsive/hero-960.webp"
      imagesrcset="/images/responsive/hero-480.webp 480w, /images/responsive/hero-960.webp 960w, /images/responsive/hero-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      data-roam-mobile-cover
      media="(max-width: 760px)"
      rel="preload"
      as="image"
      href="/images/responsive/hero-mobile-800.webp"
      imagesrcset="/images/responsive/hero-mobile-480.webp 480w, /images/responsive/hero-mobile-800.webp 800w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preload" href="/fonts/font-1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/font-3.woff2" as="font" type="font/woff2" crossorigin />
    <title>Roam America — 50 states. Endless possibilities.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
